<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Love</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css?v=202611100023">
</head>
<body>

<!-- Hearts floating up the background -->
<div class="hearts" id="hearts" aria-hidden="true"></div>

<main class="page">
  <div class="wrap">
    <div class="orbs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

    <section class="card" id="card">
      <div class="card__bars" aria-hidden="true"><span></span><span></span></div>
      <div class="sparkles" id="sparkles" aria-hidden="true"></div>
      <div class="card__body" id="stage"></div>
      <div class="card__line" aria-hidden="true"></div>
    </section>

    <footer class="footer">Made with <span class="beat">&lt;3</span> - <span id="signature">Andy</span></footer>
  </div>
</main>

<!-- "There is no NOOOOO" pop-up -->
<div class="modal" id="no-modal" hidden role="dialog" aria-modal="true" aria-labelledby="no-title">
  <div class="modal__card">
    <button class="modal__x" id="no-x" type="button" aria-label="Close">&times;</button>
    <h3 class="modal__title" id="no-title">There is no "NOOOOOO"</h3>
    <p class="modal__text">You must come with me!</p>
    <div class="media" id="no-media"></div>
    <button class="btn btn--solid" id="no-yes" type="button">Okay, I'll come!</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<script src="config.js?v=202611100023"></script>
<script src="app.js?v=202611100023"></script>
</body>
</html>
